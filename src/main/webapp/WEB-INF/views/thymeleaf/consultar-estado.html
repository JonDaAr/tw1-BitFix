<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Consulta de Estado - Taller Web I</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM - BitFix</a>
</nav>

<main role="main" class="container">
    <div class="container">
        <div id="consultabox" style="margin-top:50px;"
             class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
            <form th:action="@{/consulta-estado}" method="POST" th:object="${datosConsulta}">
                <h3 class="form-signin-heading">Consultar Estado de Pedido</h3>
                <hr class="colorgraph"><br>

                <div class="mb-3">
                    <label for="codigoSeguimiento" class="form-label">Código de Seguimiento</label>
                    <input th:field="*{codigoSeguimiento}" id="codigoSeguimiento" type="text"
                           class="form-control" placeholder="Ingrese su código (ej: 123456)" required />
                </div>

                <button id="btn-consultar" class="btn btn-lg btn-primary btn-block w-100" type="submit">
                    Consultar
                </button>

                <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="${error}"></p>
            </form>

            <div class="mt-3 text-center">
                <a th:href="@{/login}">Volver al Login</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
