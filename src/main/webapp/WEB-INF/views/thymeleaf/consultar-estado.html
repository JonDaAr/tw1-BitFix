<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Consulta de Estado - BitFix</title>

    <!-- Head Assets unificados -->
    <th:block th:replace="~{layout-fragments :: head-assets('Consulta de Estado')}"></th:block>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background-color: var(--bf-bg, #F3F6F7);">

<main role="main" class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5" style="max-width: 460px;">

            <div class="mb-3 text-start">
                <a th:href="@{/login}" class="text-decoration-none text-secondary fw-semibold small d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i>Volver al Login
                </a>
            </div>

            <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white p-4 p-sm-5"
                 style="box-shadow: 0 10px 30px rgba(3, 40, 51, 0.08) !important;">

                <div class="text-center mb-4">
                    <img th:src="@{/imagenes/logo-bitfix.svg}" alt="BitFix" class="mb-2" style="width: 52px; height: 52px; object-fit: contain;">
                    <h2 class="fw-bold mb-1" style="color: var(--bf-primary, #032833); font-size: 1.45rem;">
                        Seguimiento de Reparación
                    </h2>
                    <p class="text-muted small mb-0">Ingresá el código numérico para conocer el avance de tu equipo.</p>
                </div>

                <form th:action="@{/consulta-estado}" method="POST" th:object="${datosConsulta}">
                    <div class="mb-3">
                        <label for="codigoSeguimiento" class="form-label fw-semibold text-secondary small mb-1">
                            <i class="bi bi-qr-code me-1"></i>Código de Seguimiento
                        </label>
                        <input th:field="*{codigoSeguimiento}"
                               id="codigoSeguimiento"
                               type="text"
                               class="form-control form-control-lg font-monospace fs-6"
                               placeholder="Ej: 123456"
                               required />
                        <small class="form-text text-muted d-block mt-1" style="font-size: 0.75rem;">
                            Encontrarás este código en tu comprobante de ingreso.
                        </small>
                    </div>

                    <div class="d-grid mt-4">
                        <button id="btn-consultar" class="btn btn-primary btn-lg fw-semibold py-2" type="submit">
                            <i class="bi bi-search me-1"></i>Consultar estado
                        </button>
                    </div>

                    <div th:if="${error != null}"
                         class="alert alert-danger mt-3 d-flex align-items-center py-2 px-3 rounded-3 mb-0"
                         role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5 flex-shrink-0"></i>
                        <span class="small" th:text="${error}">Error al consultar el código</span>
                    </div>
                </form>
            </div>

            <p class="text-center text-muted small mt-4 mb-0">
                &copy; 2026 BitFix - Taller Web I
            </p>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
