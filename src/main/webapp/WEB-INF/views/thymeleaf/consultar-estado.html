<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Consulta de Estado - BitFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body class="bg-light">

<main role="main" class="container mt-5 px-3 d-flex flex-column align-items-center">
    <div class="mb-3 w-100" style="max-width: 500px;">
        <a th:href="@{/login}" class="text-decoration-none text-secondary fw-semibold">&larr; Volver al Login</a>
    </div>
    <div class="card shadow-sm border rounded-4 overflow-hidden w-100" style="max-width: 500px;">
        <div class="card-header bg-light py-3 px-4 border-bottom text-center">
            <h3 class="form-signin-heading mb-0 fs-5 fw-bold text-dark">Consultar Estado de Pedido</h3>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/consulta-estado}" method="POST" th:object="${datosConsulta}">
                <div class="mb-3">
                    <label for="codigoSeguimiento" class="form-label fw-semibold text-secondary">Código de Seguimiento</label>
                    <input th:field="*{codigoSeguimiento}" id="codigoSeguimiento" type="text"
                           class="form-control" placeholder="Ingrese su código (ej: 123456)" required />
                </div>

                <div class="d-grid mt-4">
                    <button id="btn-consultar" class="btn btn-primary btn-lg fw-semibold" type="submit">
                        Consultar
                    </button>
                </div>

                <p th:if="${error != null}" class="alert alert-danger mt-3 text-center py-2 mb-0" th:text="${error}">Error</p>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
