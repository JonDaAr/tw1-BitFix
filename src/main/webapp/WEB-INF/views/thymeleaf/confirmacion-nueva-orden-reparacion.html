<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden Registrada Correctamente</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 m-0">

<main class="container text-center" style="max-width: 500px;">
    <div class="card p-4 shadow-sm border-0">

        <div class="mb-3 text-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l5-5.25a.75.75 0 0 0-.012-1.06z"/>
            </svg>
        </div>

        <h1 class="h4 text-success fw-bold mb-3">¡Orden de reparación registrada correctamente!</h1>

        <p class="fs-5 mb-4">
            Código de Seguimiento: <span id="codigoSeguimiento" class="fw-bold text-dark" th:text="${codigoSeguimiento}"></span>
        </p>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <!-- que ir al inicio valla a la pagina home-->
             <a th:action="@{/home}" class="btn btn-outline-secondary px-4 me-sm-2">Ir al inicio</a>
             <a th:href="@{/registrar-orden}" class="btn btn-primary px-4">Registrar nueva orden</a>
         </div>

     </div>
 </main>

 <!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
