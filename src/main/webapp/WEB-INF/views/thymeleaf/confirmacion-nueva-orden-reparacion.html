<div th:fragment="modal-confirmacion" class="modal fade" id="modalConfirmacion" tabindex="-1" aria-labelledby="modalConfirmacionLabel" aria-hidden="true" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">

            <div class="modal-header border-0 justify-content-center position-relative pt-4 pb-2">

                <button type="button"
                        class="btn-close position-absolute top-0 end-0 m-3"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                </button>

                <div class="text-center">

                    <h2 class="fw-bold text-success mb-1"
                        id="modalConfirmacionLabel">
                        ¡Orden registrada!
                    </h2>

                    <p class="text-secondary small mb-0">
                        La orden fue registrada correctamente.
                    </p>

                </div>

            </div>

            <div class="modal-body px-4 pt-3 pb-4">

                <div th:if="${orden != null}"
                     class="bg-light rounded-3 p-3">

                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">

                        <span class="text-secondary small">
                            Código de seguimiento
                        </span>

                        <span class="fw-bold text-primary"
                              th:text="${orden.codigoSeguimiento}">
                            000000
                        </span>

                    </div>

                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">

                        <span class="text-secondary small">
                            Cliente
                        </span>

                        <span class="fw-semibold text-dark"
                              th:text="${orden.nombreCliente}">
                            Cliente
                        </span>

                    </div>

                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">

                        <span class="text-secondary small">
                            Equipo
                        </span>

                        <span class="fw-semibold text-dark"
                              th:text="${orden.modeloEquipo}">
                            Equipo
                        </span>

                    </div>

                    <div th:if="${orden.tecnicoAsignado != null}"
                         class="d-flex justify-content-between align-items-center py-2">

                        <span class="text-secondary small">
                            Técnico asignado
                        </span>

                        <span class="fw-semibold text-dark"
                              th:text="${orden.tecnicoAsignado.email}">
                            tecnico@email.com
                        </span>

                    </div>

                </div>

            </div>

            <div class="modal-footer border-0 px-4 pb-4 pt-0 justify-content-end">
                <a th:href="@{/tecnico/panel-tecnico}"
                   class="btn btn-primary px-4">
                    Ver Órdenes
                </a>
            </div>

        </div>

    </div>

</div>
