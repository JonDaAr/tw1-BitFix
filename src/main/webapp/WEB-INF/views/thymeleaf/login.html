<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Iniciar Sesión - BitFix</title>

    <!-- Icono head -->
    <link rel="icon" type="image/svg+xml" th:href="@{/imagenes/logo-bitfix.svg}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom bitfix stylesheet -->
    <link rel="stylesheet" th:href="@{/css/bitfix.css}" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background-color: var(--bf-bg, #F3F6F7);">

<main class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4" style="max-width: 440px;">

            <!-- Tarjeta Principal de Login -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white p-4 p-sm-5"
                 style="box-shadow: 0 10px 30px rgba(3, 40, 51, 0.08) !important;">

                <!-- Cabecera con Logo y Título -->
                <div class="text-center mb-4">
                    <img th:src="@{/imagenes/logo-bitfix.svg}" alt="BitFix" class="mb-2" style="width: 58px; height: 58px; object-fit: contain;">
                    <h2 class="fw-bold mb-1" style="color: var(--bf-primary, #032833); font-size: 1.65rem;">BitFix</h2>
                    <p class="text-muted small mb-0">Sistema de Gestión de Reparaciones</p>
                </div>

                <!-- Alerta de Error -->
                <div th:if="${error != null}"
                     class="alert alert-danger d-flex align-items-center py-2 px-3 rounded-3 mb-3"
                     role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 flex-shrink-0"></i>
                    <span class="small" th:text="${error}">Usuario o clave incorrecta</span>
                </div>

                <!-- Formulario de Login -->
                <form action="#" th:action="@{/validar-login}" method="POST" th:object="${datosLogin}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-secondary small mb-1">
                            <i class="bi bi-envelope me-1"></i>Email
                        </label>
                        <input th:field="*{email}"
                               id="email"
                               type="email"
                               class="form-control form-control-lg fs-6"
                               placeholder="tu-correo@ejemplo.com"
                               required />
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary small mb-1">
                            <i class="bi bi-lock me-1"></i>Contraseña
                        </label>
                        <input th:field="*{password}"
                               type="password"
                               id="password"
                               class="form-control form-control-lg fs-6"
                               required />
                    </div>

                    <button id="btn-login"
                            class="btn btn-primary btn-lg w-100 fw-semibold mb-3 py-2"
                            type="submit"
                            disabled>
                        Login
                    </button>
                </form>

                <!-- Botón Secundario: Consultar Estado -->
                <div class="d-grid mb-3">
                    <a th:href="@{/consultar-estado}" class="btn btn-outline-secondary py-2 fw-semibold">
                        <i class="bi bi-search me-1"></i>Consultar estado de pedido
                    </a>
                </div>

                <!-- Enlace de Registro con más aire -->
                <div class="text-center pt-3 mt-2 border-top">
                    <span class="text-muted small">¿No tenés una cuenta? </span>
                    <a id="btn-register"
                       th:href="@{/nuevo-usuario}"
                       class="fw-semibold text-decoration-none ms-1"
                       style="color: var(--bf-secondary, #3D7C91);">
                        Registrarme
                    </a>
                </div>

            </div>

            <!-- Footer sutil -->
            <p class="text-center text-muted small mt-4 mb-0">
                &copy; 2026 BitFix - Taller Web I
            </p>

        </div>
    </div>
</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<!-- Login validation script -->
<script type="module" th:src="@{js/login.js}"></script>
</body>

</html>
