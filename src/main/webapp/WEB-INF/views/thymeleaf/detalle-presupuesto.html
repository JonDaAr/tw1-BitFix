<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto de Reparación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light py-5">

<main class="container" style="max-width: 750px;">

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">

        <div class="card-header bg-primary text-white p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0 font-weight-bold">Presupuesto de Reparación</h1>
                <span class="badge bg-light text-primary fs-6"
                      th:text="${codigoSeguimiento != null ? 'Orden #' + codigoSeguimiento : 'Orden #---'}"></span>
            </div>
        </div>

        <div class="card-body p-4">

            <div class="row mb-4" th:if="${orden != null}">
                <div class="col-md-6 mb-2">
                    <h6 class="text-uppercase text-muted fw-bold fs-7">Cliente</h6>
                    <p class="mb-1 text-dark font-weight-bold" th:text="${orden.nombreCliente}"></p>
                    <p class="mb-0 text-secondary" th:text="${orden.emailCliente}"></p>
                </div>
                <div class="col-md-6 mb-2 text-md-end">
                    <h6 class="text-uppercase text-muted fw-bold fs-7">Equipo</h6>
                    <p class="mb-1 text-dark font-weight-bold" th:text="${orden.modeloEquipo}"></p>
                    <p class="mb-0 text-secondary" th:text="${orden.descripcionFalla}"></p>
                </div>
            </div>

            <hr class="my-4">

            <h5 class="h6 font-weight-bold text-dark mb-3">Detalle del Servicio y Repuestos</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Concepto / Repuesto</th>
                        <th class="text-center">Cantidad</th>
                        <th class="text-end">Precio Unitario</th>
                        <th class="text-end">Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${itemsPresupuesto}">
                        <td th:text="${item.nombreRepuesto}">SSD 480GB</td>
                        <td class="text-center" th:text="${item.cantidad}">1</td>
                        <td class="text-end" th:text="${'$' + #numbers.formatDecimal(item.precioUnitario, 1, 'POINT', 2, 'COMMA')}">$32.000,00</td>
                        <td class="text-end fw-bold text-dark" th:text="${'$' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}">$32.000,00</td>
                    </tr>

                    <tr th:if="${costoManoDeObra != null && costoManoDeObra > 0}">
                        <td>Mano de obra y diagnóstico</td>
                        <td class="text-center">1</td>
                        <td class="text-end" th:text="${'$' + #numbers.formatDecimal(costoManoDeObra, 1, 'POINT', 2, 'COMMA')}">$15.000,00</td>
                        <td class="text-end fw-bold text-dark" th:text="${'$' + #numbers.formatDecimal(costoManoDeObra, 1, 'POINT', 2, 'COMMA')}">$15.000,00</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end align-items-center bg-light p-3 rounded mt-3">
                <span class="fs-5 me-3 text-secondary">Total Estimado:</span>
                <span class="fs-3 fw-bold text-success"
                      th:text="${total != null ? '$' + #numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA') : '$0.00'}"></span>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mt-4 pt-2">
                <a th:href="@{/home}" class="btn btn-outline-secondary px-4">Volver al inicio</a>

                <div class="d-flex gap-2 justify-content-end">
                    <form th:action="@{/presupuesto/rechazar}" method="post">
                        <input type="hidden" name="codigoSeguimiento" th:value="${codigoSeguimiento}" />
                        <button type="submit" class="btn btn-outline-danger px-4">Rechazar</button>
                    </form>

                    <form th:action="@{/presupuesto/aceptar}" method="post">
                        <input type="hidden" name="codigoSeguimiento" th:value="${codigoSeguimiento}" />
                        <button type="submit" class="btn btn-success px-4 fw-bold">Aceptar Presupuesto</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
