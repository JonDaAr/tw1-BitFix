<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Armado de Presupuesto - BitFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 900px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold">Presupuesto de Repuestos y Componentes</h4>
        </div>
        <div class="card-body p-4">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div th:if="${total != null}" class="card bg-white border shadow-sm mb-4">
                <div class="card-header bg-light fw-bold">
                    Resumen Estimado del Presupuesto
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Subtotal Repuestos:</span>
                        <span class="fw-semibold" th:text="'$' + ${subtotalRepuestos}">$0.0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Mano de Obra (Taller):</span>
                        <span class="fw-semibold text-primary" th:text="'$' + ${manoDeObra}">$0.0</span>
                    </div>
                    <hr class="my-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fs-5 fw-bold">Total Final:</span>
                        <span class="fs-4 fw-bold text-success" th:text="'$' + ${total}">$0.0</span>
                    </div>
                </div>
            </div>

            <form th:action="@{/presupuesto/enviar}" th:object="${form}" method="post">

                <input type="hidden"
                       name="codigoSeguimiento"
                       th:value="${codigoSeguimiento}" />
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Repuesto / Pieza</th>
                            <th>Precio Unitario</th>
                            <th>Stock</th>
                            <th style="width: 140px;">Cantidad</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(repuestos)}">
                            <td colspan="4" class="text-center text-muted py-3">No hay repuestos registrados en el sistema.</td>
                        </tr>
                        <tr th:each="repuesto, stat : ${repuestos}">
                            <td class="fw-semibold" th:text="${repuesto.nombre}"></td>
                            <td th:text="'$' + ${repuesto.precio}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${repuesto.stock} + ' disponibles'"></span>
                            </td>
                            <td>
                                <input type="hidden"
                                       th:name="|items[${stat.index}].repuestoId|"
                                       th:value="${repuesto.id}" />

                                <input type="number"
                                       class="form-control"
                                       min="0"
                                       th:max="${repuesto.stock}"
                                       th:name="|items[${stat.index}].cantidad|"
                                       th:value="${form.items != null && #lists.size(form.items) > stat.index ? form.items[stat.index].cantidad : 0}" />
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
    <div class="d-flex justify-content-end gap-3">

        <div class="d-flex justify-content-end gap-3 mt-3">
            <a th:href="@{/inventario(codigo=${codigoSeguimiento})}"
               class="btn btn-primary px-4 py-2 fw-semibold">
                Agregar Accesorio
            </a>

            <button type="submit"
                    th:formaction="@{/presupuesto/calcular}"
                    class="btn btn-outline-secondary px-4 py-2 fw-semibold">
                Calcular Presupuesto
            </button>

            <button type="submit"
                    th:formaction="@{/presupuesto/enviar}"
                    class="btn btn-success px-4 py-2 fw-semibold">
                Enviar al Cliente
            </button>
        </div>
    </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
