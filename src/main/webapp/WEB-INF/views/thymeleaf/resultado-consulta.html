<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Consulta - TallerWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Estado de la Orden de Reparación</h4>
        </div>
        <div class="card-body" th:if="${pedido != null}">
            <div class="mb-3">
                <strong>Código de Seguimiento:</strong>
                <span th:text="${pedido.codigoSeguimiento}">1001</span>
            </div>
            <div class="mb-3">
                <strong>Cliente:</strong>
                <span th:text="${pedido.nombreCliente}">Juan Pérez</span>
            </div>
            <div class="mb-3">
                <strong>Equipo:</strong>
                <span th:text="${pedido.modeloEquipo}">MacBook Air</span>
            </div>
            <div class="mb-3">
                <strong>Falla Reportada:</strong>
                <span th:text="${pedido.descripcionFalla}">No enciende</span>
            </div>
            <div class="mb-3">
                <strong>Estado Actual:</strong>
                <span class="badge bg-info text-dark" th:text="${pedido.estado}">PENDIENTE</span>
            </div>

            <div class="mb-3" th:if="${pedido.tecnicoAsignado != null}">
                <strong>Técnico Asignado:</strong>
                <span th:text="${pedido.tecnicoAsignado.email}">tecnico@taller.com</span>
            </div>
            <div class="mb-3" th:if="${pedido.tecnicoAsignado == null}">
                <strong>Técnico Asignado:</strong>
                <span class="text-muted">Sin asignar</span>
            </div>

            <hr>
            <div class="d-grid">
                <a th:href="@{/consultar-estado}" class="btn btn-outline-secondary">
                    Consultar otro código
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
