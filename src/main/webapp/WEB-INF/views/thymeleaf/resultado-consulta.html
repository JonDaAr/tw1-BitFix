<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Resultado de Consulta - BitFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container-fluid py-4 px-3 d-flex justify-content-center">
    <div class="card shadow-sm border rounded-4 overflow-hidden w-100" style="max-width: 600px;">

        <div class="card-header bg-light py-4 px-4 border-bottom text-center">
            <h4 class="mb-0 fw-bold text-dark">Estado de la Orden de Reparación</h4>
        </div>


        <div class="card-body p-4" th:if="${pedido != null}">

            <!-- Fila: Código de Seguimiento -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2">
                <span class="text-secondary fw-semibold">Código de Seguimiento:</span>
                <span class="fw-bold text-dark font-monospace" th:text="${pedido.codigoSeguimiento}">1001</span>
            </div>

            <!-- Fila: Cliente -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2">
                <span class="text-secondary fw-semibold">Cliente:</span>
                <span class="text-dark" th:text="${pedido.nombreCliente}">Juan Pérez</span>
            </div>

            <!-- Fila: Equipo -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2">
                <span class="text-secondary fw-semibold">Equipo:</span>
                <span class="text-dark" th:text="${pedido.modeloEquipo}">MacBook Air</span>
            </div>

            <!-- Fila: Falla Reportada -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2">
                <span class="text-secondary fw-semibold">Falla Reportada:</span>
                <span class="text-dark text-end" th:text="${pedido.descripcionFalla}">No enciende</span>
            </div>

            <!-- Fila: Estado Actual -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2">
                <span class="text-secondary fw-semibold">Estado Actual:</span>
                <span class="badge bg-light border text-dark px-3 py-2 fw-semibold" th:text="${pedido.estado}">PENDIENTE</span>
            </div>

            <!-- Fila: Técnico Asignado (Condicional si existe) -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2" th:if="${pedido.tecnicoAsignado != null}">
                <span class="text-secondary fw-semibold">Técnico Asignado:</span>
                <span class="text-dark" th:text="${pedido.tecnicoAsignado.email}">tecnico@taller.com</span>
            </div>

            <!-- Fila: Técnico Asignado (Condicional si NO existe) -->
            <div class="mb-3 d-flex justify-content-between align-items-center border-bottom pb-2" th:if="${pedido.tecnicoAsignado == null}">
                <span class="text-secondary fw-semibold">Técnico Asignado:</span>
                <span class="text-muted fst-italic">Sin asignar</span>
            </div>

            <!-- Botones de acción inferiores -->
            <div class="d-flex justify-content-end gap-2 mt-3 pt-1">
                <a th:href="@{/consultar-estado}" class="btn btn-primary py-2 fw-semibold text-center btn-lg" style="width: 170px;">
                    Consultar otro
                </a>
                <!--
                <a th:href="@{/home}" class="btn btn-primary py-2 fw-semibold text-center" style="width: 150px;" th:if="${session.usuario != null}">
                    Ver Órdenes
                </a>
                -->
            </div>

        </div>
    </div>
</div>

</body>
</html>
