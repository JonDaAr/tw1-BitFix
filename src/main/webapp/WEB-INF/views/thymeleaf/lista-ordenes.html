<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Ordenes</title>

    <!-- Bootstrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<!---->
<body>

<main role="main" class="container" style="margin-top: 80px;">
    <h2 style="color: black">Listado de Ordenes de Reparación</h2>
    <hr>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Modelo Equipo</th>
            <th>Estado</th>
            <th>Nota Técnica</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- iteramos sobre la lista de ordenes que mandamos desde el controlador -->
        <tr th:each="orden : ${ordenes}">
            <td th:text="${orden.idOrdenReparacion}">1</td>
            <td th:text="${orden.modeloEquipo}">Notebook</td>
            <td th:text="${orden.estado.name().replace('_', ' ')}">RECIBIDO</td>
            <td th:text="${orden.notaTecnica != null ? orden.notaTecnica : 'Sin notas'}">Sin notas</td>
            <td>
                <!-- usando RequestParam: genera /ordenes/editar?id=X -->
                <a class="btn btn-sm btn-primary" th:href="@{/ordenes/editar(idOrden=${orden.idOrdenReparacion})}">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<!-- Bootstrap core js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
