<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Crear Cuenta - BitFix</title>

  <!-- Head Assets unificados -->
  <th:block th:replace="~{layout-fragments :: head-assets('Crear Cuenta')}"></th:block>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background-color: var(--bf-bg, #F3F6F7);">

<main role="main" class="container px-3">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-7 col-xl-6" style="max-width: 580px;">

      <div class="mb-3 text-start">
        <a th:href="@{/login}" class="text-decoration-none text-secondary fw-semibold small d-inline-flex align-items-center gap-1">
          <i class="bi bi-arrow-left"></i>Volver al Login
        </a>
      </div>

      <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white p-4 p-sm-5"
           style="box-shadow: 0 10px 30px rgba(3, 40, 51, 0.08) !important;">

        <div class="text-center mb-4">
          <img th:src="@{/imagenes/logo-bitfix.svg}" alt="BitFix" class="mb-2" style="width: 54px; height: 54px; object-fit: contain;">
          <h2 class="h4 fw-bold mb-1" style="color: var(--bf-primary, #032833);">Crear Nueva Cuenta</h2>
          <p class="text-muted small mb-0">Completá tus datos para registrarte en el portal de clientes.</p>
        </div>

        <div th:if="${error != null}"
             class="alert alert-danger d-flex align-items-center py-2 px-3 rounded-3 mb-3"
             role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2 fs-5 flex-shrink-0"></i>
          <span class="small" th:text="${error}">Error al registrar usuario</span>
        </div>

        <form th:action="@{/guardar-usuario}" method="POST" th:object="${datosRegistro}">
          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Nombre</label>
              <input type="text"
                     th:field="*{nombre}"
                     class="form-control"
                     placeholder="Juan"
                     required
                     minlength="2" />
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Apellido</label>
              <input type="text"
                     th:field="*{apellido}"
                     class="form-control"
                     placeholder="Pérez"
                     required
                     minlength="2" />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label small fw-semibold text-secondary mb-1">Nombre de Usuario</label>
            <input type="text"
                   th:field="*{nombreUsuario}"
                   class="form-control"
                   placeholder="juanperez"
                   required
                   minlength="4" />
          </div>

          <div class="mb-2">
            <label class="form-label small fw-semibold text-secondary mb-1">Email</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control"
                   placeholder="juan@ejemplo.com"
                   required />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary mb-1">Teléfono</label>
            <input type="tel"
                   th:field="*{telefono}"
                   class="form-control"
                   placeholder="1122334455"
                   required
                   pattern="[0-9]+"
                   title="Solo ingrese números" />
          </div>

          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Contraseña</label>
              <input type="password"
                     th:field="*{password}"
                     class="form-control"
                     required
                     minlength="6" />
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Repetir Contraseña</label>
              <input type="password"
                     th:field="*{repetirPassword}"
                     class="form-control"
                     required
                     minlength="6" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold py-2">
            <i class="bi bi-person-plus me-1"></i>Registrarse
          </button>
        </form>

        <div class="text-center pt-3 mt-3 border-top">
          <span class="text-muted small">¿Ya tenés una cuenta? </span>
          <a th:href="@{/login}" class="fw-semibold text-decoration-none ms-1" style="color: var(--bf-secondary, #3D7C91);">
            Iniciar sesión
          </a>
        </div>

      </div>

      <p class="text-center text-muted small mt-4 mb-0">
        &copy; 2026 BitFix - Taller Web I
      </p>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
