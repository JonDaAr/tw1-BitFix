<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM - BitFix</a>
  </nav>

  <main role="main" class="container">

    <div class="container">
      <div id="loginbox" style="margin-top:50px;" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
        <form th:action="@{/guardar-usuario}" method="POST" th:object="${datosRegistro}">

          <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

          <div class="form-group mb-3">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required minlength="2" />
          </div>

          <div class="form-group mb-3">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" class="form-control" required minlength="2" />
          </div>

          <div class="form-group mb-3">
            <label>Nombre de Usuario</label>
            <input type="text" th:field="*{nombreUsuario}" class="form-control" required minlength="4" />
          </div>

          <div class="form-group mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required />
          </div>

          <div class="form-group mb-3">
            <label>Teléfono</label>
            <input type="tel" th:field="*{telefono}" class="form-control" required pattern="[0-9]+" title="Solo ingrese números" />
          </div>

          <div class="form-group mb-3">
            <label>Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control" required minlength="6" />
          </div>

          <div class="form-group mb-3">
            <label>Repetir Contraseña</label>
            <input type="password" th:field="*{repetirPassword}" class="form-control" required minlength="6" />
          </div>

          <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        </form>

      </div>
    </div>

  </main>
  <!-- /.container -->

  <!-- Boostrap core js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
