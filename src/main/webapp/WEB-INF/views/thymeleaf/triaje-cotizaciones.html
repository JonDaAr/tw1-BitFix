<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Triaje - BitFix</title>

    <!-- Head Assets unificados de tu proyecto -->
    <th:block th:replace="~{layout-fragments :: head-assets('Triaje')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home-tecnico.css}">

    <style>
        .orders-table th {
            padding: 12px 14px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        .orders-table td {
            padding: 12px 14px;
            vertical-align: middle;
            background-color: var(--bf-card-bg, #ffffff);
        }
    </style>
</head>
<body style="background-color: var(--bf-bg, #F3F6F7);">

<!-- Sidebar unificada del técnico (le pasamos 'triaje' para que marque el botón activo) -->
<aside th:replace="~{layout-fragments :: sidebar-tecnico('triaje')}"></aside>

<!-- Contenedor principal idéntico a panel-tecnico -->
<main class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-4 p-2">
        <div>
            <h2 class="h4 fw-bold mb-1" style="color: var(--bf-primary, #032833);">
                Bandeja de Triaje
            </h2>
            <p class="text-muted small mb-0">
                Evaluá las cotizaciones web entrantes y asigná la complejidad (Tier) para derivarlas.
            </p>
        </div>
        <a th:href="@{/tecnico/panel-tecnico}" class="btn btn-outline-secondary btn-sm">Volver al Panel</a>
    </div>

    <!-- Mensaje de error si falla el algoritmo de asignación -->
    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white mb-4">
        <div class="table-responsive">
            <table class="table orders-table align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-4">Seguimiento</th>
                    <th>Ingreso</th>
                    <th>Cliente</th>
                    <th>Equipo</th>
                    <th>Falla Reportada</th>
                    <th class="pe-4 text-end">Asignar Tier</th>
                </tr>
                </thead>
                <tbody>
                <!-- Mensaje si no hay órdenes en triaje -->
                <tr th:if="${#lists.isEmpty(ordenes)}">
                    <td colspan="6" class="p-5 text-center text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary opacity-50"></i>
                        No hay cotizaciones pendientes de revisión en este momento.
                    </td>
                </tr>

                <!-- Listado de órdenes en triaje -->
                <tr th:each="orden : ${ordenes}" class="bg-white">
                    <td class="ps-4 fw-bold bg-white">
                        <span class="font-monospace text-dark" th:text="${orden.codigoSeguimiento}"></span>
                    </td>
                    <td class="bg-white">
                        <span class="text-dark small" th:text="${#temporals.format(orden.fechaIngreso, 'dd/MM/yyyy HH:mm')}"></span>
                    </td>
                    <td class="fw-semibold text-dark bg-white" th:text="${orden.nombreCliente}"></td>
                    <td class="bg-white text-dark" th:text="${orden.modeloEquipo}"></td>
                    <td class="bg-white">
                                <span class="text-muted small text-truncate d-inline-block" style="max-width: 200px;"
                                      th:title="${orden.descripcionFalla}"
                                      th:text="${orden.descripcionFalla}"></span>
                    </td>
                    <td class="pe-4 bg-white text-end">
                        <form th:action="@{/tecnico/derivar-cotizacion}" method="post" class="d-inline-flex align-items-center justify-content-end">
                            <input type="hidden" name="idOrden" th:value="${orden.idOrdenReparacion}" />

                            <select name="nivelReparacion" class="form-select form-select-sm me-2" required style="min-width: 140px;">
                                <option value="" disabled selected>Complejidad</option>
                                <option th:each="nivel : ${nivelesSoporte}"
                                        th:value="${nivel}"
                                        th:text="${nivel}">
                                </option>
                            </select>

                            <button type="submit" class="btn btn-primary btn-sm fw-semibold">Derivar</button>
                        </form>


                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
