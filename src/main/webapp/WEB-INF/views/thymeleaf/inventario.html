<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Inventario - BitFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 950px;">

    <!-- Encabezado con navegación al presupuesto -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0">Inventario de Repuestos</h3>
        <a th:href="@{/presupuesto(codigo=${codigoSeguimiento})}"
           class="btn btn-outline-primary fw-semibold">
            Ir a Presupuesto &rarr;
        </a>
    </div>

    <!-- Formulario de alta / edición -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold" th:text="${nuevoRepuesto.id != null} ? 'Editar Repuesto' : 'Registrar Nuevo Repuesto'"></h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/inventario/guardar}" th:object="${nuevoRepuesto}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" name="codigo" th:value="${codigoSeguimiento}" />
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre del repuesto / pieza</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Batería iPhone 11 / RAM 8GB" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Precio Unitario ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" placeholder="0.00" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Stock inicial</label>
                        <input type="number" min="0" class="form-control" th:field="*{stock}" placeholder="0" required />
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:if="${nuevoRepuesto.id != null}" th:href="@{/inventario}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4 fw-semibold" th:text="${nuevoRepuesto.id != null} ? 'Actualizar' : 'Guardar Repuesto'"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla con el listado actual -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold text-secondary">Catálogo Actual</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Repuesto</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(repuestos)}">
                        <td colspan="5" class="text-center text-muted py-4">No hay repuestos dados de alta en el sistema.</td>
                    </tr>
                    <tr th:each="r : ${repuestos}">
                        <td class="ps-4 text-muted" th:text="${r.id}"></td>
                        <td class="fw-semibold" th:text="${r.nombre}"></td>
                        <td th:text="'$' + ${r.precio}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${r.stock > 0} ? 'bg-success' : 'bg-danger'"
                                  th:text="${r.stock} + ' unidades'">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{'/inventario/editar/' + ${r.id}(codigo=${codigoSeguimiento})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                            <a th:href="@{'/inventario/eliminar/' + ${r.id}}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Seguro que querés eliminar este repuesto?');">
                                Eliminar
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
