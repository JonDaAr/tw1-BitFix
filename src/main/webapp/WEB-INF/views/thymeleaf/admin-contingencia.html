<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout-fragments :: head-assets('Módulo de Contingencia')}"></head>
<body class="bg-light">

<div class="d-flex" style="min-height: 100vh;">
    <!-- Inyectamos la sidebar del admin -->
    <div th:replace="~{layout-fragments :: sidebar-admin('contingencia')}"></div>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
            <h1 class="h2">Reasignación de Órdenes (Contingencia)</h1>
        </div>

        <!-- Alertas -->
        <div th:if="${param.exito != null}" class="alert alert-success alert-dismissible fade show shadow-sm border-0" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> Orden reasignada exitosamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white">
            <div class="card-header bg-white py-3 px-4 border-bottom">
                <h5 class="mb-0 fw-bold fs-6" style="color: var(--bf-primary, #032833);">
                    <i class="bi bi-arrow-left-right me-2"></i>Órdenes Activas en Taller
                </h5>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">Código</th>
                            <th>Equipo</th>
                            <th>Nivel Req.</th>
                            <th>Técnico Actual</th>
                            <th class="text-end pe-4">Reasignar a...</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(ordenes)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay órdenes activas.</td>
                        </tr>
                        <tr th:each="orden : ${ordenes}">
                            <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${orden.codigoSeguimiento}">#123456</td>
                            <td th:text="${orden.modeloEquipo}">Equipo</td>
                            <td><span class="badge bg-secondary" th:text="${orden.nivelReparacion}">NIVEL</span></td>

                            <td th:text="${orden.tecnicoAsignado != null ? (orden.tecnicoAsignado.nombre != null ? orden.tecnicoAsignado.nombre + ' ' + orden.tecnicoAsignado.apellido : orden.tecnicoAsignado.email) : 'Sin asignar'}">Técnico</td>

                            <td class="text-end pe-4">
                                <form th:action="@{/admin/contingencia/reasignar}" method="post" class="d-flex justify-content-end gap-2 m-0">
                                    <input type="hidden" name="idOrden" th:value="${orden.idOrdenReparacion}" />

                                    <select name="idTecnico" class="form-select form-select-sm" style="width: auto;" required>
                                        <option value="" selected disabled>Seleccionar técnico...</option>
                                        <!-- Listamos los técnicos, excluyendo al que ya la tiene asignada -->
                                        <th:block th:each="tec : ${tecnicos}">
                                            <option th:if="${orden.tecnicoAsignado == null or tec.id != orden.tecnicoAsignado.id}"
                                                    th:value="${tec.id}"
                                                    th:text="${tec.nombre != null ? tec.nombre + ' ' + tec.apellido + ' (' + tec.nivelSoporte + ')' : tec.email + ' (' + tec.nivelSoporte + ')'}">
                                            </option>
                                        </th:block>
                                    </select>

                                    <button type="submit" class="btn btn-sm btn-warning fw-bold text-dark px-3">
                                        Transferir
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
