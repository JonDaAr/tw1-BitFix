<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Editar Orden - BitFix</title>

    <!-- Head Assets unificados -->
    <th:block th:replace="~{layout-fragments :: head-assets('Editar Orden')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home-tecnico.css}">
    <style>
        .sidebar-item.active {
            background-color: var(--bf-primary, #032833) !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(3, 40, 51, 0.2) !important;
        }
        .sidebar-item.active i,
        .sidebar-item.active span {
            color: #ffffff !important;
        }
    </style>
</head>

<body style="background-color: var(--bf-bg, #F3F6F7);">

<!-- Sidebar unificada del técnico -->
<aside th:replace="~{layout-fragments :: sidebar-tecnico('ordenes')}"></aside>

<main class="main-content">
    <div class="container-fluid p-0" style="max-width: 850px;">

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white mb-4">
            <div class="p-4 border-bottom bg-white d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h4 fw-bold mb-1" style="color: var(--bf-primary, #032833);">Editar Orden de Reparación</h1>
                    <p class="text-muted small mb-0">Modificá el estado y agregá observaciones técnicas sobre la orden.</p>
                </div>
                <a th:href="@{/tecnico/panel-tecnico}" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-medium">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                </a>
            </div>

            <div class="p-4">
                <form th:action="@{/ordenes/actualizar}"
                      method="POST"
                      th:object="${ordenAActualizar}">

                    <input type="hidden" th:field="*{idOrdenReparacion}">

                    <!-- Información del equipo -->
                    <div class="mb-4">
                        <h6 class="fw-bold small text-uppercase letter-spacing-1 mb-2" style="color: var(--bf-secondary, #3D7C91);">
                            <i class="bi bi-laptop me-1"></i>Información del Dispositivo
                        </h6>
                        <div class="p-3 bg-light rounded-3 border">
                            <span class="text-secondary small d-block mb-1">Modelo registrado:</span>
                            <div class="fs-6 fw-bold text-dark" th:text="*{modeloEquipo}">
                                Modelo del equipo
                            </div>
                        </div>
                    </div>

                    <!-- Estado de la orden -->
                    <div class="mb-4">
                        <h6 class="fw-bold small text-uppercase letter-spacing-1 mb-2" style="color: var(--bf-secondary, #3D7C91);">
                            <i class="bi bi-arrow-repeat me-1"></i>Estado de la Orden
                        </h6>
                        <div>
                            <label for="estado" class="form-label small fw-semibold text-secondary mb-1">
                                Nuevo Estado
                            </label>
                            <select id="estado"
                                    class="form-select"
                                    th:field="*{estado}">
                                <option th:each="estado : ${estados}"
                                        th:value="${estado}"
                                        th:text="${estado.descripcion}">
                                    ESTADO
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Información técnica -->
                    <div class="mb-4">
                        <h6 class="fw-bold small text-uppercase letter-spacing-1 mb-2" style="color: var(--bf-secondary, #3D7C91);">
                            <i class="bi bi-journal-text me-1"></i>Diagnóstico y Observaciones
                        </h6>
                        <div>
                            <label for="notaTecnica" class="form-label small fw-semibold text-secondary mb-1">
                                Nota Técnica
                            </label>
                            <textarea id="notaTecnica"
                                      class="form-control"
                                      rows="5"
                                      th:field="*{notaTecnica}"
                                      placeholder="Ingresá observaciones, informe técnico del diagnóstico o piezas cambiadas...">
                            </textarea>
                        </div>
                    </div>

                    <!-- Acciones -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/tecnico/panel-tecnico}" class="btn btn-outline-secondary px-4 py-2 fw-semibold">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i>Guardar cambios
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
