<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Editar Orden - BitFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="icon"
          type="image/svg+xml"
          th:href="@{/imagenes/logo-bitfix.svg}">

    <link rel="stylesheet"
          th:href="@{/css/home-tecnico.css}">
</head>

<body>

<aside class="sidebar">

    <div class="sidebar-header">
        <div class="brand-container">

            <img th:src="@{/imagenes/logo-bitfix.svg}"
                 alt="BitFix"
                 style="width: 60px; height: auto;">

            <div>
                <div class="brand-title">BitFix</div>
                <div class="brand-subtitle">Técnico</div>
            </div>

        </div>
    </div>


    <nav class="sidebar-menu">

        <a th:href="@{/tecnico/nueva-orden}"
           class="sidebar-item">
            <span>Nueva Orden</span>
        </a>

        <a th:href="@{/tecnico/panel-tecnico}"
           class="sidebar-item active">
            <span>Órdenes</span>
        </a>
        <div class="sidebar-logout">

            <a th:href="@{/login}"
               class="sidebar-item">

                <span class="text-danger">Cerrar sesión</span>

            </a>

        </div>
    </nav>


    <div class="sidebar-user">

        <div class="user-avatar">
            AD
        </div>

        <div>
            <div class="user-name">
                Usuario Técnico
            </div>

            <div class="user-email">
                Área Técnica
            </div>
        </div>

    </div>




</aside>

<main class="main-content">

    <div class="orders-card edit-order-card">

        <div class="orders-header">

            <div>

                <h2>Editar Orden de Reparación</h2>

                <p>
                    Modificá el estado y agregá información técnica de la orden.
                </p>

            </div>

        </div>
        <form th:action="@{/ordenes/actualizar}"
              method="POST"
              th:object="${ordenAActualizar}"
              class="edit-order-form m-3">

            <input type="hidden"
                   th:field="*{idOrdenReparacion}">


            <div class="form-section">

                <div class="form-section-title">
                    Información del equipo
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Modelo del equipo
                    </label>

                    <div class="form-control bg-light"
                         th:text="*{modeloEquipo}">
                        Modelo del equipo
                    </div>

                </div>

            </div>

            <div class="form-section">

                <div class="form-section-title">
                    Estado de la orden
                </div>

                <div class="mb-3">

                    <label for="estado"
                           class="form-label">
                        Estado
                    </label>

                    <select id="estado"
                            class="form-select"
                            th:field="*{estado}">

                        <option th:each="estado : ${estados}"
                                th:value="${estado}"
                                th:text="${estado.name().replace('_', ' ')}">
                        </option>

                    </select>

                </div>

            </div>

            <div class="form-section">

                <div class="form-section-title">
                    Información técnica
                </div>

                <div class="mb-3">

                    <label for="notaTecnica"
                           class="form-label">
                        Nota Técnica
                    </label>

                    <textarea id="notaTecnica"
                              class="form-control"
                              rows="5"
                              th:field="*{notaTecnica}"
                              placeholder="Ingresá observaciones o información técnica sobre la reparación...">
                    </textarea>

                </div>

            </div>

            <div class="edit-order-actions">

                <a th:href="@{/tecnico/panel-tecnico}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-success">

                    Guardar cambios

                </button>

            </div>

        </form>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
