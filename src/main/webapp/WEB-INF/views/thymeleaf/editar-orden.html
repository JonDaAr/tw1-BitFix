<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Editar Orden</title>

    <!-- Bootstrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<!---->
<body>

<main role="main" class="container" style="margin-top: 80px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3>Editar Orden de Reparación</h3>
            <hr>

            <!-- Formulario vinculado al objeto 'orden' que mandó el controlador -->
            <form action="#" th:action="@{/ordenes/actualizar}" method="POST" th:object="${ordenAActualizar}">

                <!-- campo oculto para mantener el ID de la orden que estamos editando -->
                <input type="hidden" th:field="*{idOrdenReparacion}" />

                <div class="mb-3">
                    <label class="form-label">Modelo Equipo:</label>
                    <p class="form-control-static" th:text="*{modeloEquipo}"></p>
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado:</label>

                    <!-- selector desplegable con los estados -->
                    <select id="estado" class="form-control" th:field="*{estado}">
                        <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado.name().replace('_', ' ')}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="notaTecnica" class="form-label">Nota Técnica:</label>
                    <textarea id="notaTecnica" class="form-control" rows="4" th:field="*{notaTecnica}"></textarea>
                </div>

                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                <a th:href="@{/ordenes}" class="btn btn-secondary">Cancelar</a>

                <!-- mensaje de error si llega a fallar algo -->
                <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="${error}"></p>
            </form>
        </div>
    </div>
</main>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
