<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Presupuesto enviado - BitFix</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white">
            <h4 class="mb-0">
                Presupuesto enviado correctamente
            </h4>
        </div>

        <div class="card-body text-center p-4">

            <p class="fs-5">
                El presupuesto fue asociado a la orden.
            </p>

            <p>
                <strong>Código de seguimiento:</strong>
                <span th:text="${codigoSeguimiento}"></span>
            </p>

            <p>
                <strong>Total:</strong>
                <span th:text="'$' + ${total}"></span>
            </p>

            <a th:href="@{/tecnico/panel-tecnico}"
               class="btn btn-primary">
                Volver a órdenes
            </a>

        </div>

    </div>

</div>

</body>
</html>
