<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Enviado - BitFix</title>

    <!-- Head Assets unificados -->
    <th:block th:replace="~{layout-fragments :: head-assets('Presupuesto Enviado')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home-tecnico.css}">
    <style>
        .sidebar-item.active {
            background-color: var(--bf-primary, #032833) !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(3, 40, 51, 0.2) !important;
        }
        .sidebar-item.active i,
        .sidebar-item.active span {
            color: #ffffff !important;
        }
    </style>
</head>

<body style="background-color: var(--bf-bg, #F3F6F7);">

<!-- Sidebar unificada del técnico -->
<aside th:replace="~{layout-fragments :: sidebar-tecnico('ordenes')}"></aside>

<main class="main-content">
    <div class="container-fluid p-0" style="max-width: 650px;">

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white mb-4">

            <div class="p-4 border-bottom bg-success bg-opacity-10 text-success d-flex align-items-center gap-3">
                <div class="d-flex align-items-center justify-content-center rounded-circle bg-success text-white"
                     style="width: 48px; height: 48px;">
                    <i class="bi bi-check-lg fs-3"></i>
                </div>
                <div>
                    <h1 class="h4 fw-bold mb-0 text-success">Presupuesto Enviado con Éxito</h1>
                    <p class="small text-muted mb-0">La cotización fue registrada y está disponible para el cliente.</p>
                </div>
            </div>

            <div class="card-body p-4">
                <div class="bg-light p-4 rounded-3 border mb-4">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-2 border-bottom">
                        <span class="text-secondary small fw-semibold">Código de Seguimiento:</span>
                        <span class="badge bg-petroleum text-white font-monospace px-3 py-1.5 rounded-pill"
                              th:text="${codigoSeguimiento}">1001</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center py-2 mb-1" th:if="${subtotalRepuestos != null}">
                        <span class="text-secondary small">Repuestos y Componentes:</span>
                        <span class="fw-bold text-dark font-monospace"
                              th:text="${'$' + #numbers.formatDecimal(subtotalRepuestos, 1, 'POINT', 2, 'COMMA')}">$0,00</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center py-2 mb-1" th:if="${manoDeObra != null}">
                        <span class="text-secondary small">Mano de Obra (Taller):</span>
                        <span class="fw-bold font-monospace" style="color: var(--bf-secondary, #3D7C91);"
                              th:text="${'$' + #numbers.formatDecimal(manoDeObra, 1, 'POINT', 2, 'COMMA')}">$0,00</span>
                    </div>

                    <hr class="my-2">

                    <div class="d-flex justify-content-between align-items-center pt-2">
                        <span class="fw-bold text-dark">Total Presupuestado:</span>
                        <span class="fs-4 fw-bold text-success font-monospace"
                              th:text="${total != null ? '$' + #numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA') : '$0,00'}">$0,00</span>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/tecnico/panel-tecnico}" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Órdenes
                    </a>
                </div>
            </div>

        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
