<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto enviado - BitFix</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light py-5">

<div class="container" style="max-width: 650px;">

    <div class="card shadow-sm border rounded-4 overflow-hidden">

        <div class="card-header bg-success bg-opacity-25 text-success border-bottom py-4 px-4">
            <h4 class="mb-0 fw-bold">
                Presupuesto enviado correctamente
            </h4>
        </div>

        <div class="card-body p-4">
            <p class="fs-5 text-secondary mb-4 text-center">
                El presupuesto fue asociado a la orden con éxito.
            </p>

            <div class="text-start bg-white p-3 rounded border mb-3">
                <p class="mb-2"><strong>Código de seguimiento:</strong> <span th:text="${codigoSeguimiento}"></span></p>
                <p class="mb-2" th:if="${subtotalRepuestos != null}"><strong>Repuestos:</strong> <span th:text="'$' + ${subtotalRepuestos}"></span></p>
                <p class="mb-2" th:if="${manoDeObra != null}"><strong>Mano de obra:</strong> <span class="text-primary" th:text="'$' + ${manoDeObra}"></span></p>
                <hr class="my-2">
                <p class="mb-0 fs-5"><strong>Total:</strong> <span class="text-success fw-bold" th:text="'$' + ${total}"></span></p>
            </div>

            <a th:href="@{/tecnico/panel-tecnico}" class="btn btn-primary">
                Volver a órdenes
            </a>
        </div>

    </div>

</div>

</body>
</html>
