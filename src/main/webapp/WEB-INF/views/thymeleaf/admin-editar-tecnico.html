<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout-fragments :: head-assets('Editar Técnico')}"></head>
<body style="background-color: var(--bf-bg, #F3F6F7);">

<aside th:replace="~{layout-fragments :: sidebar-admin('tecnicos')}"></aside>

<main class="main-content">
  <div class="container-fluid p-0" style="max-width: 800px;">

    <div th:if="${error != null}" class="alert alert-danger shadow-sm border-0 rounded-3 mb-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
    </div>

    <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white mb-4">
      <div class="p-4 border-bottom bg-white d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h4 fw-bold mb-1" style="color: var(--bf-primary, #032833);">Editar Técnico</h1>
          <p class="text-muted small mb-0">Modificar datos personales y nivel de soporte técnico.</p>
        </div>
        <a th:href="@{/admin/tecnicos}" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-medium">
          <i class="bi bi-arrow-left me-1"></i>Volver a la Nómina
        </a>
      </div>

      <div class="p-4">
        <form th:action="@{'/admin/tecnicos/editar/' + ${idTecnico}}" th:object="${datosRegistro}" method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Nombre</label>
              <input type="text" class="form-control bg-white" th:field="*{nombre}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Apellido</label>
              <input type="text" class="form-control bg-white" th:field="*{apellido}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Correo Electrónico (Usuario)</label>
              <input type="email" class="form-control bg-white" th:field="*{email}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Nueva Contraseña (Dejar vacío para no cambiar)</label>
              <input type="password" class="form-control bg-white" th:field="*{password}">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-secondary mb-1">Nivel de Soporte (Tier)</label>
              <select class="form-select bg-white" th:field="*{nivelSoporte}" required>
                <option value="" disabled>Seleccionar nivel...</option>
                <option value="NIVEL_1">Tier 1 (Básico)</option>
                <option value="NIVEL_2">Tier 2 (Intermedio)</option>
                <option value="NIVEL_3">Tier 3 (Avanzado)</option>
              </select>
            </div>
          </div>
          <hr class="my-4 text-muted opacity-25">
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-4 fw-semibold rounded-pill">
              <i class="bi bi-save me-1"></i>Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
