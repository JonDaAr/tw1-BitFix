<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout-fragments :: head-assets('Editar Técnico')}"></head>
<body class="bg-light">

<div class="d-flex" style="min-height: 100vh;">
  <div th:replace="~{layout-fragments :: sidebar-admin('tecnicos')}"></div>

  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
      <h1 class="h2">Editar Técnico</h1>
      <a th:href="@{/admin/tecnicos}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Volver a la Nómina
      </a>
    </div>

    <div th:if="${error != null}" class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
    </div>

    <div class="card shadow-sm border-0 rounded-4 bg-white">
      <div class="card-header bg-white py-3 px-4 border-bottom">
        <h5 class="mb-0 fw-bold fs-6" style="color: var(--bf-primary, #032833);">
          <i class="bi bi-person-vcard me-2"></i>Modificar Datos del Empleado
        </h5>
      </div>
      <div class="card-body p-4">
        <form th:action="@{'/admin/tecnicos/editar/' + ${idTecnico}}" th:object="${datosRegistro}" method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-secondary fw-medium">Nombre</label>
              <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-secondary fw-medium">Apellido</label>
              <input type="text" class="form-control" th:field="*{apellido}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-secondary fw-medium">Correo Electrónico (Usuario)</label>
              <input type="email" class="form-control" th:field="*{email}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-secondary fw-medium">Nueva Contraseña (Dejar vacío para no cambiar)</label>
              <input type="password" class="form-control" th:field="*{password}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label text-secondary fw-medium">Nivel de Soporte (Tier)</label>
              <select class="form-select" th:field="*{nivelSoporte}" required>
                <option value="" disabled>Seleccionar nivel...</option>
                <option value="NIVEL_1">Tier 1 (Básico)</option>
                <option value="NIVEL_2">Tier 2 (Intermedio)</option>
                <option value="NIVEL_3">Tier 3 (Avanzado)</option>
              </select>
            </div>
          </div>
          <hr class="my-4">
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-4 fw-medium">
              <i class="bi bi-save me-2"></i>Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
