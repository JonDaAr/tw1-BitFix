<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recepción de Equipo - BitFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body class="bg-light py-5">

<main class="container" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <h1 class="h3 fw-bold text-primary mb-4 text-center">Recepción de Equipo</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/recepcion}" th:object="${datosOrden}" method="post">

            <div class="mb-3">
                <label for="nombreCliente" class="form-label fw-semibold">Cliente</label>
                <input type="text" id="nombreCliente" class="form-control" th:field="*{nombreCliente}" required>
            </div>

            <div class="mb-3">
                <label for="emailCliente" class="form-label fw-semibold">Email</label>
                <input type="email" id="emailCliente" class="form-control" th:field="*{emailCliente}" required>
            </div>

            <div class="mb-3">
                <label for="modeloEquipo" class="form-label fw-semibold">Equipo</label>
                <input type="text" id="modeloEquipo" class="form-control" th:field="*{modeloEquipo}" placeholder="Ej: Notebook Dell" required>
            </div>

            <div class="mb-3">
                <label for="descripcionFalla" class="form-label fw-semibold">Falla reportada</label>
                <textarea id="descripcionFalla" class="form-control" rows="3" th:field="*{descripcionFalla}" required></textarea>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Registrar equipo</button>
            </div>

        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
