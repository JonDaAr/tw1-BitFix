<div th:fragment="formulario-recepcion"
     xmlns:th="http://www.w3.org/1999/xhtml"
     class="new-order-form p-3">

    <form th:action="@{/recepcion}"
          th:object="${datosOrden}"
          method="post">

        <div class="form-section-title">
            Información del cliente
        </div>


        <div class="row">

            <div class="col-md-6 mb-1">

                <label for="nombreCliente"
                       class="form-label">

                    Cliente

                </label>

                <input type="text"
                       id="nombreCliente"
                       class="form-control"
                       th:field="*{nombreCliente}"
                       placeholder="Nombre y apellido"
                       required>

            </div>


            <div class="col-md-6 mb-1">

                <label for="emailCliente"
                       class="form-label">

                    Email

                </label>

                <input type="email"
                       id="emailCliente"
                       class="form-control"
                       th:field="*{emailCliente}"
                       placeholder="cliente@email.com"
                       required>

            </div>

        </div>


        <div class="form-section-title mt-3">
            Información del equipo
        </div>


        <div class="mb-1">

            <label for="modeloEquipo"
                   class="form-label">

                Equipo

            </label>

            <input type="text"
                   id="modeloEquipo"
                   class="form-control"
                   th:field="*{modeloEquipo}"
                   placeholder="Ej: Notebook Dell Inspiron"
                   required>

        </div>


        <div class="mb-1">

            <label for="descripcionFalla"
                   class="form-label">

                Falla reportada

            </label>

            <textarea id="descripcionFalla"
                      class="form-control"
                      rows="4"
                      th:field="*{descripcionFalla}"
                      placeholder="Describí el problema que presenta el equipo..."
                      required>
            </textarea>

        </div>

        <div class="new-order-actions">
            <button type="submit"
                    class="btn btn-new-order">

                Registrar equipo

            </button>

        </div>

    </form>

</div>
