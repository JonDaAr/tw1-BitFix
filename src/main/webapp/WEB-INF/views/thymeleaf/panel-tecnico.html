<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Técnicos - Gestión de Órdenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" th:href="@{/css/semaforo.css}" />
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid d-flex align-items-center">
        <a class="navbar-brand fw-bold" href="#">
            BitFix - Area Técnica
        </a>

        <span class="navbar-text text-light ms-3"
              th:if="${tecnico != null}"
              th:text="'Técnico: ' + ${tecnico.email}">
        </span>

        <a th:href="@{/login}"
           class="btn btn-primary ms-auto">
            Cerrar Sesión
        </a>
    </div>
</nav>

<main class="container-fluid px-4">

    <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Órdenes de Reparación Asignadas</h2>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th># Orden</th>
                        <th>Cliente</th>
                        <th>Equipo</th>
                        <th>Falla Reportada</th>
                        <th>Estado</th>
                        <th>Prioridad</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="orden : ${ordenesAsignadas}">
                        <td class="fw-bold" th:text="${orden.codigoSeguimiento}">1001</td>
                        <td th:text="${orden.nombreCliente}">Juan Pérez</td>
                        <td th:text="${orden.modeloEquipo}">Notebook Dell XPS</td>
                        <td th:text="${orden.descripcionFalla}">No enciende</td>
                        <td>
                            <span class="badge bg-warning text-dark" th:text="${orden.estado}">PENDIENTE_PRESUPUESTO</span>
                        </td>
                        <td>
                            <span th:class="'badge semaforo-' + ${orden.colorPrioridad}"
                                  th:text="${orden.prioridad}">ALTA</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/presupuesto(codigo=${orden.codigoSeguimiento})}"
                               class="btn btn-sm btn-primary">
                                Ir a Presupuesto
                            </a>
                            <a th:href="@{/ordenes/editar(idOrden=${orden.idOrdenReparacion})}"
                               class="btn btn-sm btn-primary">
                                Editar estado
                            </a>

                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ordenesAsignadas)}">
                        <td colspan="7" class="text-center py-4 text-muted">No tienes órdenes asignadas pendientes.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
