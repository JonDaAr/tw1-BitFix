<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Técnico - BitFix Admin</title>
    <!-- Importamos los head-assets unificados para tener la misma tipografía y estilos -->
    <th:block th:replace="~{layout-fragments :: head-assets('Alta de Técnico')}"></th:block>
</head>
<body class="bg-light">

<div class="d-flex" style="min-height: 100vh;">
    <!-- Inyectamos la sidebar del admin marcando la sección activa -->
    <div th:replace="~{layout-fragments :: sidebar-admin('tecnicos')}"></div>

    <!-- Contenido Principal -->
    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
            <h1 class="h2">Registrar Nuevo Técnico</h1>
            <a th:href="@{/admin/tecnicos}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver a la Nómina
            </a>
        </div>

        <!-- Mensaje de Error -->
        <div th:if="${error != null}" class="alert alert-danger shadow-sm border-0" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Formulario de Alta -->
        <div class="card shadow-sm border-0" style="max-width: 800px;">
            <div class="card-header bg-white border-bottom py-3">
                <h5 class="mb-0 text-primary"><i class="bi bi-person-badge me-2"></i>Datos del Empleado</h5>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/admin/tecnicos/guardar}" th:object="${datosRegistro}" method="post">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-medium">Nombre</label>
                            <input type="text" class="form-control bg-light" id="nombre" th:field="*{nombre}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellido" class="form-label fw-medium">Apellido</label>
                            <input type="text" class="form-control bg-light" id="apellido" th:field="*{apellido}" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-medium">Correo Electrónico (Usuario)</label>
                            <input type="email" class="form-control bg-light" id="email" th:field="*{email}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-medium">Contraseña Inicial</label>
                            <input type="password" class="form-control bg-light" id="password" th:field="*{password}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary fw-medium">Nivel de Soporte (Tier)</label>
                            <select class="form-select" th:field="*{nivelSoporte}" required>
                                <option value="" selected disabled>Seleccionar nivel...</option>
                                <option value="NIVEL_1">Tier 1 (Básico)</option>
                                <option value="NIVEL_2">Tier 2 (Intermedio)</option>
                                <option value="NIVEL_3">Tier 3 (Avanzado)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Info estática sobre el rol -->
                    <div class="alert alert-light border mb-4">
                        <i class="bi bi-shield-lock me-2 text-warning"></i>
                        El sistema asignará automáticamente el rol <strong>TECNICO</strong> a esta cuenta para que pueda acceder a las órdenes de reparación.
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Crear Cuenta de Técnico
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
