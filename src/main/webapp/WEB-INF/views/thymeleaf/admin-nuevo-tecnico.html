<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Técnico - BitFix Admin</title>
    <!-- Importamos los head-assets unificados para tener la misma tipografía y estilos -->
    <th:block th:replace="~{layout-fragments :: head-assets('Alta de Técnico')}"></th:block>
</head>
<body style="background-color: var(--bf-bg, #F3F6F7);">

<aside th:replace="~{layout-fragments :: sidebar-admin('tecnicos')}"></aside>

<main class="main-content">
    <div class="container-fluid p-0" style="max-width: 800px;">

        <!-- Mensaje de Error -->
        <div th:if="${error != null}" class="alert alert-danger shadow-sm border-0 rounded-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Formulario de Alta -->
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white mb-4">
            <div class="p-4 border-bottom bg-white d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h4 fw-bold mb-1" style="color: var(--bf-primary, #032833);">Registrar Nuevo Técnico</h1>
                    <p class="text-muted small mb-0">Alta de credenciales y nivel de soporte técnico.</p>
                </div>
                <a th:href="@{/admin/tecnicos}" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-medium">
                    <i class="bi bi-arrow-left me-1"></i>Volver a la Nómina
                </a>
            </div>

            <div class="p-4">
                <form th:action="@{/admin/tecnicos/guardar}" th:object="${datosRegistro}" method="post">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label small fw-semibold text-secondary mb-1">Nombre</label>
                            <input type="text" class="form-control bg-white" id="nombre" th:field="*{nombre}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellido" class="form-label small fw-semibold text-secondary mb-1">Apellido</label>
                            <input type="text" class="form-control bg-white" id="apellido" th:field="*{apellido}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="email" class="form-label small fw-semibold text-secondary mb-1">Correo Electrónico (Usuario)</label>
                            <input type="email" class="form-control bg-white" id="email" th:field="*{email}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label small fw-semibold text-secondary mb-1">Contraseña Inicial</label>
                            <input type="password" class="form-control bg-white" id="password" th:field="*{password}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary mb-1">Nivel de Soporte (Tier)</label>
                            <select class="form-select bg-white" th:field="*{nivelSoporte}" required>
                                <option value="" selected disabled>Seleccionar nivel...</option>
                                <option value="NIVEL_1">Tier 1 (Básico)</option>
                                <option value="NIVEL_2">Tier 2 (Intermedio)</option>
                                <option value="NIVEL_3">Tier 3 (Avanzado)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Info estática sobre el rol -->
                    <div class="alert alert-light border rounded-3 mb-4">
                        <i class="bi bi-shield-lock me-2 text-warning"></i>
                        El sistema asignará automáticamente el rol <strong>TECNICO</strong> a esta cuenta para que pueda acceder a las órdenes de reparación.
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold rounded-pill">
                            <i class="bi bi-save me-1"></i> Crear Cuenta de Técnico
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
